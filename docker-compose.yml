services:
  suveren:
    build: .
    ports:
      # Published on the host's loopback only: the agent port lets whoever
      # connects act under the signed-in person's mandates. To reach it from
      # other machines, change 127.0.0.1 AND set SUVEREN_MCP_TOKEN below.
      - "127.0.0.1:${SUVEREN_UI_PORT:-7400}:3000"
      - "127.0.0.1:${SUVEREN_MCP_PORT:-7430}:3030"
    volumes:
      - ${HOME}/.suveren:/app/data
    environment:
      - SUVEREN_AS_URL=https://www.suveren.ai
      # The host port AI assistants use (the container itself binds 3030) —
      # shown in the UI's "connect your assistant" snippet.
      - SUVEREN_MCP_PUBLIC_PORT=${SUVEREN_MCP_PORT:-7430}
    network_mode: bridge
    restart: unless-stopped
