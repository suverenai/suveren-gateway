name: Publish Windows installer

# Windows installer for company laptops (W2/W4-W6/W8 — suveren-as/docs/
# work-plan.md "Added 2026-10-02 — Windows installer"). Built UNSIGNED by us
# (decision, Andreas: "we do not sell the software, so we do not sign it") —
# a company's own IT verifies origin, signs with its own certificate
# (build-signed.ps1) and distributes via Intune. This workflow only ever
# produces the UNSIGNED installer + the signing kit that makes re-signing
# possible.
#
# Runs the full build + install test on every PR touching bundle/windows/**
# or this file (no publishing there); publishes installer assets to the
# GitHub Release for the tag on a `v*` push or workflow_dispatch. Runs
# alongside publish-npm.yml / publish.yml (neither of those creates a GitHub
# Release today, so there's nothing to race — this workflow is the first
# thing that does).

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'bundle/windows/**'
      - '.github/workflows/publish-windows.yml'
  workflow_dispatch:

jobs:
  # ─── Build the offline payload: bundled Node + gateway bundle + every
  #     manifest-pinned connector, installed with THAT Node build. ──────────
  build-payload:
    name: build payload
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Check out profile catalog
        uses: actions/checkout@v6
        with:
          repository: humanagencyprotocol/hap-profiles
          path: .hap-profiles

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build apps
        run: pnpm build

      - name: Assemble bundle
        run: node bundle/build.mjs
        env:
          HAP_PROFILES_SRC: ${{ github.workspace }}\.hap-profiles

      - name: Install bundle runtime deps
        working-directory: bundle/dist
        run: npm install --omit=dev --no-audit --no-fund

      - name: Read gateway version
        id: version
        shell: bash
        run: |
          set -e
          V=$(jq -r .version bundle/dist/package.json)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "gateway version: $V"

      - name: Build offline Windows payload (Node + bundle + pinned connectors)
        run: node bundle/windows/build-payload.mjs

      - name: Payload summary
        shell: bash
        run: |
          echo "::group::payload tree (top level)"
          ls -la bundle/windows/payload
          echo "::endgroup::"
          echo "::group::node"
          ls bundle/windows/payload/node | head -20
          echo "::endgroup::"
          echo "::group::integrations"
          ls bundle/windows/payload/integrations/node_modules 2>/dev/null || echo "(none)"
          echo "::endgroup::"

      - name: Payload file counts + longest paths (diagnostic — WiX harvesting has known long-path limits)
        # -e only, no pipefail: `sort | head` makes head close the pipe early,
        # SIGPIPE-ing sort/find (exit 141) — harmless truncation, not a real
        # failure, but pipefail (GH's bash default) propagates it and failed
        # this purely diagnostic step for real on windows-latest.
        shell: bash -e {0}
        run: |
          echo "::group::file counts"
          echo "total:        $(find bundle/windows/payload -type f | wc -l)"
          echo "node:         $(find bundle/windows/payload/node -type f | wc -l)"
          echo "gateway:      $(find bundle/windows/payload/gateway -type f | wc -l)"
          echo "integrations: $(find bundle/windows/payload/integrations -type f | wc -l)"
          for pkg in crm-mcp records-mcp erp-mcp; do
            echo "  @humanagencyp/$pkg: $(find "bundle/windows/payload/integrations/node_modules/@humanagencyp/$pkg" -type f 2>/dev/null | wc -l) file(s)"
          done
          echo "::endgroup::"
          echo "::group::node_modules/.bin shims (every connector is SPAWNED through these)"
          ls bundle/windows/payload/integrations/node_modules/.bin 2>/dev/null | grep -E '^(crm|records|erp)-mcp' || echo "MISSING — connectors will refuse to start"
          echo "::endgroup::"
          echo "::group::10 longest paths under payload (chars)"
          find bundle/windows/payload -type f | awk '{ print length, $0 }' | sort -rn | head -10
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-payload
          path: bundle/windows/payload
          if-no-files-found: error
          # Default is false, which silently drops every dot-prefixed path —
          # including node_modules/.bin/, the directory every connector is
          # actually SPAWNED through (config.command resolves via PATH, which
          # includes that dir). Without this, every connector's package.json
          # lands fine but its bin shim doesn't, isUsableInstall() sees no
          # usable install for ANY connector, and SUVEREN_OFFLINE=1 refuses
          # every one with "not part of this installation" even though the
          # package itself is right there on disk. Confirmed on
          # windows-latest: installed file counts matched the source payload
          # almost exactly, except for exactly the missing .bin shims.
          include-hidden-files: true

  # ─── Build the unsigned .msi from the payload + WiX source. ──────────────
  build-msi:
    name: build msi
    needs: build-payload
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: windows-payload
          path: bundle/windows/payload

      - name: Install WiX v5 (+ UI extension, for the interactive-install Finish checkbox)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Verify tag matches payload version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          V="${{ needs.build-payload.outputs.version }}"
          echo "git tag: v$TAG"
          echo "payload: $V"
          if [ "$TAG" != "$V" ]; then
            echo "::error::Payload version ($V) does not match git tag ($TAG). Update package.json (root) before tagging."
            exit 1
          fi

      - name: wix build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle\windows\out | Out-Null
          $payload = (Resolve-Path bundle\windows\payload).Path
          $launcher = (Resolve-Path bundle\windows\launcher.cmd).Path
          wix build bundle\windows\wix\Product.wxs `
            -ext WixToolset.UI.wixext/5.0.2 `
            -d "ProductVersion=${{ needs.build-payload.outputs.version }}" `
            -d "PayloadDir=$payload" `
            -d "LauncherSource=$launcher" `
            -arch x64 `
            -out bundle\windows\out\suveren-gateway.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi-unsigned
          path: bundle/windows/out/suveren-gateway.msi
          if-no-files-found: error

  # ─── W5: prove the signing kit actually works — self-signed test cert,
  #     build-signed.ps1 end to end, verify every inner file + the msi. ─────
  prove-signing-kit:
    name: prove signing kit
    needs: build-payload
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: windows-payload
          path: kit/payload

      - name: Install WiX v5 (+ UI extension, for the interactive-install Finish checkbox)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Stage the kit (payload + WiX source + launcher + script — exactly what the release zip ships)
        shell: pwsh
        run: |
          Copy-Item -Recurse bundle\windows\wix kit\wix
          Copy-Item bundle\windows\launcher.cmd kit\launcher.cmd
          Copy-Item bundle\windows\build-signed.ps1 kit\build-signed.ps1

      - name: Create a self-signed code-signing certificate and trust it on THIS runner only
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Subject "CN=Suveren CI Test Signing" `
            -Type CodeSigningCert `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA -KeyLength 2048 `
            -NotAfter (Get-Date).AddDays(7)
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

          # Trust it the way a real machine would trust a certificate it
          # decided to accept: as a root CA AND as a trusted publisher. This
          # is ONLY ever done to THIS disposable CI runner, never in the
          # installer or build-signed.ps1 itself — that trust decision is
          # entirely a real IT department's, done on their own machines.
          $certPath = "cert:\CurrentUser\My\$($cert.Thumbprint)"
          Export-Certificate -Cert $certPath -FilePath kit-test-cert.cer | Out-Null
          Import-Certificate -FilePath kit-test-cert.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath kit-test-cert.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null

      - name: Run build-signed.ps1 with the test certificate
        shell: pwsh
        run: |
          .\kit\build-signed.ps1 `
            -Thumbprint "${{ steps.cert.outputs.thumbprint }}" `
            -PayloadDir "$(Resolve-Path kit\payload)" `
            -WixSourceDir "$(Resolve-Path kit\wix)" `
            -OutDir "$(Resolve-Path kit)\out" `
            -ProductVersion "${{ needs.build-payload.outputs.version }}"

      - name: signtool verify every signed binary + the msi
        shell: pwsh
        run: |
          function Find-SignTool {
            $cmd = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            $found = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
            if ($found) { return $found.FullName }
            throw "signtool.exe not found on this runner"
          }
          $signtool = Find-SignTool
          Write-Host "signtool: $signtool"

          $failed = $false
          # Same exclusion as build-signed.ps1: non-Windows prebuilt native
          # binaries (darwin/linux .node files shipped alongside the win32
          # one) were never signed in the first place.
          $binaries = Get-ChildItem -Path kit\payload -Recurse -Include '*.exe','*.dll','*.node' -File |
            Where-Object { $_.FullName -notmatch '\\prebuilds\\(darwin|linux|linuxmusl)-' }
          Write-Host "Verifying $($binaries.Count) signed payload file(s) …"
          foreach ($f in $binaries) {
            & $signtool verify /pa /v $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::signtool verify failed for $($f.FullName)"
              $failed = $true
            }
          }

          $msi = Join-Path (Resolve-Path kit\out) 'suveren-gateway.msi'
          Write-Host "Verifying $msi …"
          & $signtool verify /pa /v $msi
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::signtool verify failed for $msi"
            $failed = $true
          }

          if ($failed) { throw "one or more signtool verify checks failed" }
          Write-Host "All signed files verified against the test certificate."

      - name: SHA256SUMS present and non-empty
        shell: pwsh
        run: |
          $sums = Join-Path (Resolve-Path kit\out) 'SHA256SUMS'
          if (-not (Test-Path $sums)) { throw "SHA256SUMS missing at $sums" }
          Get-Content $sums
          if ((Get-Content $sums).Count -lt 1) { throw "SHA256SUMS is empty" }
          if ([System.IO.File]::ReadAllText($sums).Contains("`r")) { throw "SHA256SUMS has CRLF line endings — shasum -c on macOS/Linux cannot read it" }
          bash -c "cd kit/out && sha256sum -c SHA256SUMS"
          if ($LASTEXITCODE -ne 0) { throw "sha256sum -c failed on the kit SHA256SUMS" }

  # ─── The real install path: msiexec, then launcher + service, with npm
  #     unreachable — no network dependency anywhere in the started gateway. ─
  install-test:
    name: install test
    needs: build-msi
    runs-on: windows-latest
    timeout-minutes: 20
    # Job-level, not step-level: each step in a workflow is its OWN fresh
    # pwsh process, so a `$env:X = …` assignment inside one step's script is
    # invisible to the next one — confirmed for real on windows-latest. Every
    # step needs the SAME ports, so job-level env is what bundle-smoke.yml's
    # `smoke` job already uses for the same reason.
    #
    # Deliberately NO SUVEREN_DATA_DIR override: this test leaves the
    # interactive gateway RUNNING into the final `msiexec /x` (see "Uninstall
    # the msi" below), to prove the uninstall-cleanup custom action
    # (StopGatewayOnUninstall in Product.wxs) actually stops it before files
    # are removed. That custom action runs with no inherited job env — it
    # resolves the DEFAULT data dir, same as any real end user who never sets
    # this — so the gateway it needs to find and stop must use that same
    # default, not a job-only override it could never see.
    env:
      SUVEREN_CP_PORT: '15400'
      SUVEREN_MCP_PORT: '15430'
      SUVEREN_INTERNAL_SECRET: windows-install-test-internal-secret
      # Points at nothing — proves no step below ever needs the registry.
      npm_config_registry: 'http://127.0.0.1:9'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: windows-msi-unsigned
          path: msi

      - name: Install (per-user, silent — the Intune path)
        shell: pwsh
        run: |
          $msi = (Resolve-Path msi\suveren-gateway.msi).Path
          $log = "$env:RUNNER_TEMP\install.log"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "::group::install log"
            Get-Content $log
            Write-Host "::endgroup::"
            throw "msiexec /i exited $($p.ExitCode)"
          }
          Write-Host "installed, exit code $($p.ExitCode)"

      - name: Installed files present
        shell: pwsh
        run: |
          $root = "$env:LOCALAPPDATA\Programs\Suveren"
          $expect = @(
            "$root\suveren-gateway.cmd",
            "$root\node\node.exe",
            "$root\gateway\server.js",
            "$root\gateway\bin\suveren-gateway.js"
          )
          $missing = $expect | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "missing after install: $($missing -join ', ')" }
          Write-Host "install root: $root"
          Get-ChildItem $root

          # Diagnostic: compare against the payload's own file counts (see the
          # "Payload file counts" step in build-payload) to tell whether files
          # were lost during WiX harvesting / MSI install (a known long-path
          # risk — Windows Installer / .NET file enumeration can silently skip
          # paths over MAX_PATH) versus somewhere else entirely.
          Write-Host "`nfile counts under install root:"
          Write-Host "  total:        $((Get-ChildItem $root -Recurse -File).Count)"
          Write-Host "  node:         $((Get-ChildItem "$root\node" -Recurse -File -ErrorAction SilentlyContinue).Count)"
          Write-Host "  gateway:      $((Get-ChildItem "$root\gateway" -Recurse -File -ErrorAction SilentlyContinue).Count)"
          Write-Host "  integrations: $((Get-ChildItem "$root\integrations" -Recurse -File -ErrorAction SilentlyContinue).Count)"
          foreach ($pkg in @('crm-mcp', 'records-mcp', 'erp-mcp')) {
            $dir = "$root\integrations\node_modules\@humanagencyp\$pkg"
            $count = (Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue).Count
            Write-Host "  @humanagencyp/${pkg}: $count file(s) at $dir"
          }
          Write-Host "`nnode_modules/.bin shims (every connector is SPAWNED through these):"
          Get-ChildItem "$root\integrations\node_modules\.bin" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(crm|records|erp)-mcp' } |
            ForEach-Object { Write-Host "  $($_.Name)" }

      - name: HKCU\Environment is untouched — the installer must not be account-wide
        shell: pwsh
        run: |
          # An earlier version of the installer wrote SUVEREN_INSTALL_METHOD,
          # SUVEREN_OFFLINE, SUVEREN_INTEGRATIONS_DIR and a PATH prepend for
          # the bundled node here. HKCU\Environment is ACCOUNT-WIDE: that
          # would shadow a developer's own Node for every other program on
          # this Windows account, and force every other gateway install under
          # the same user into offline+managed mode too — unacceptable for a
          # company deploying this to many people. The scheduled task is
          # routed through the launcher instead (see launcher.cmd's `run` and
          # buildWindowsTaskXml's command/args override), which scopes that
          # env to just the gateway's own process tree.
          $envKey = Get-ItemProperty -Path 'HKCU:\Environment' -ErrorAction SilentlyContinue
          $suverenVars = @()
          if ($envKey) {
            $suverenVars = $envKey.PSObject.Properties |
              Where-Object { $_.Name -like 'SUVEREN_*' } |
              ForEach-Object { "$($_.Name)=$($_.Value)" }
          }
          if ($suverenVars) {
            throw "HKCU\Environment carries SUVEREN_* value(s) the installer must never write: $($suverenVars -join ', ')"
          }
          Write-Host "HKCU\Environment: no SUVEREN_* values (confirmed)"

          $userPath = if ($envKey) { $envKey.Path } else { $null }
          if ($userPath -and $userPath -like '*Programs\Suveren*') {
            throw "HKCU\Environment's PATH contains the install dir: $userPath"
          }
          Write-Host "HKCU\Environment PATH: does not contain the install dir (confirmed)$(if ($userPath) { " — value: $userPath" })"

      - name: Start via the installed launcher — npm unreachable, no node on PATH but the bundled one
        shell: pwsh
        run: |
          # No node on PATH except the one this gateway was installed with.
          # The bundled node.exe's OWN directory must still be on PATH: every
          # connector's node_modules\.bin shim (crm-mcp.cmd etc.) is an
          # npm-generated wrapper that itself invokes a bare `node ...`,
          # assuming npm's own install already put one on PATH — launcher.cmd
          # prepends exactly this directory for exactly this reason (for its
          # OWN process, both interactively here and for the scheduled task's
          # `run` subcommand — see launcher.cmd, there is no MSI-level PATH
          # entry). This only has to make sure nothing ELSE is on PATH that
          # could be mistaken for it (a real Node install, a different npm).
          # Step-scoped (not job-level) since every OTHER step still needs its
          # own normal PATH to find pwsh-invoked tools.
          $env:PATH = "$env:LOCALAPPDATA\Programs\Suveren\node;$env:SystemRoot\System32;$env:SystemRoot"

          # Deliberately NO SUVEREN_DATA_DIR override — see the job-level env
          # comment above. This instance's PID file lands at the real default
          # (%USERPROFILE%\.suveren\gateway.pid), exactly where the
          # uninstall-cleanup custom action's `stop` call will look for it.
          & "$env:LOCALAPPDATA\Programs\Suveren\suveren-gateway.cmd" start --detach
          if ($LASTEXITCODE -ne 0) { throw "launcher start --detach exited $LASTEXITCODE" }

      - name: Wait for health + assert managed connectors started offline
        shell: pwsh
        run: |
          $cpHealth = 'http://localhost:15400/health'
          $mcpHealth = 'http://localhost:15430/health'

          $deadline = (Get-Date).AddSeconds(180)
          $body = $null
          while ((Get-Date) -lt $deadline) {
            try {
              $body = Invoke-RestMethod -Uri $cpHealth -TimeoutSec 5
              if ($body.status -eq 'ok') { break }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $body) { throw "control plane /health never answered within 180s" }
          Write-Host ($body | ConvertTo-Json -Depth 5)

          # detectInstallMethod() (apps/control-plane/src/index.ts) reads
          # SUVEREN_INSTALL_METHOD=managed since PR #36 (merged to main) —
          # the launcher sets it, so this is now a hard requirement, not a
          # warning.
          if ($body.installMethod -ne 'managed') {
            throw "installMethod is '$($body.installMethod)', expected 'managed' for the interactively-started instance"
          }
          Write-Host "installMethod: managed (confirmed — interactive instance)"

          $mcpDeadline = (Get-Date).AddSeconds(240)
          $mcpBody = $null
          $targets = @('crm', 'records', 'erp')
          while ((Get-Date) -lt $mcpDeadline) {
            try {
              $mcpBody = Invoke-RestMethod -Uri $mcpHealth -TimeoutSec 5
              $statuses = $mcpBody.integrations | Where-Object { $targets -contains $_.id }
              $allUp = ($statuses.Count -eq $targets.Count) -and ($statuses | ForEach-Object { $_.running -and $_.toolCount -gt 0 } ) -notcontains $false
              if ($allUp) { break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          Write-Host ($mcpBody | ConvertTo-Json -Depth 5)
          foreach ($id in $targets) {
            $entry = $mcpBody.integrations | Where-Object { $_.id -eq $id }
            if (-not $entry) { throw "${id}: not in the integration registry — did not auto-start" }
            if (-not $entry.running) { throw "${id}: registered but not running ($($entry.error))" }
            if ($entry.toolCount -le 0) { throw "${id}: running but discovered 0 tools" }
            Write-Host "$id : running, $($entry.toolCount) tool(s) — started OFFLINE (SUVEREN_OFFLINE=1, npm unreachable)"
          }

      - name: service install — scheduled task created, pointed at the launcher
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Programs\Suveren\suveren-gateway.cmd" service install
          if ($LASTEXITCODE -ne 0) { throw "service install exited $LASTEXITCODE" }
          $t = Get-ScheduledTask -TaskName 'Suveren' -ErrorAction Stop
          Write-Host "scheduled task present: $($t.TaskName), state $($t.State)"

          # The task must run the LAUNCHER (`run`), not node.exe + server.js
          # directly — that's what makes the launcher's env apply to the
          # autostart path without ever touching HKCU\Environment.
          $action = $t.Actions[0]
          Write-Host "action: $($action.Execute) $($action.Arguments)"
          $expectedLauncher = "$env:LOCALAPPDATA\Programs\Suveren\suveren-gateway.cmd"
          if ($action.Execute -ne $expectedLauncher) {
            throw "scheduled task's Command is '$($action.Execute)', expected the launcher '$expectedLauncher'"
          }
          if ($action.Arguments -ne 'run') {
            throw "scheduled task's Arguments is '$($action.Arguments)', expected 'run'"
          }
          Write-Host "scheduled task command confirmed: launcher + 'run'"

      - name: Run the scheduled task once — exercises the autostart path without a reboot
        shell: pwsh
        run: |
          # schtasks /Run starts the task's action in a FRESH environment (the
          # way a real ONLOGON trigger would, not inherited from this shell) —
          # on the default ports and default data dir, since nothing here
          # overrides them for the task. The interactive gateway from the
          # earlier step is on 15400/15430, so there's no port clash.
          schtasks /Run /TN Suveren
          if ($LASTEXITCODE -ne 0) { throw "schtasks /Run exited $LASTEXITCODE" }

          # Control plane — for installMethod. The MCP server's own /health
          # (queried below) carries no such field.
          $cpHealth = 'http://localhost:3400/health'
          $cpDeadline = (Get-Date).AddSeconds(120)
          $cpBody = $null
          while ((Get-Date) -lt $cpDeadline) {
            try {
              $cpBody = Invoke-RestMethod -Uri $cpHealth -TimeoutSec 5
              if ($cpBody.status -eq 'ok') { break }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $cpBody) { throw "control plane /health never answered within 120s (scheduled-task instance)" }
          if ($cpBody.installMethod -ne 'managed') {
            throw "installMethod is '$($cpBody.installMethod)', expected 'managed' for the scheduled-task-started instance"
          }
          Write-Host "installMethod: managed (confirmed — scheduled-task instance)"

          $mcpHealth = 'http://localhost:3430/health'
          $deadline = (Get-Date).AddSeconds(240)
          $targets = @('crm', 'records', 'erp')
          $body = $null
          while ((Get-Date) -lt $deadline) {
            try {
              $body = Invoke-RestMethod -Uri $mcpHealth -TimeoutSec 5
              $statuses = $body.integrations | Where-Object { $targets -contains $_.id }
              $allUp = ($statuses.Count -eq $targets.Count) -and ($statuses | ForEach-Object { $_.running -and $_.toolCount -gt 0 }) -notcontains $false
              if ($allUp) { break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          Write-Host ($body | ConvertTo-Json -Depth 5)
          foreach ($id in $targets) {
            $entry = $body.integrations | Where-Object { $_.id -eq $id }
            if (-not $entry) { throw "autostart: ${id} not in the integration registry — did not auto-start via the scheduled task" }
            if (-not $entry.running) { throw "autostart: ${id} registered but not running ($($entry.error))" }
            if ($entry.toolCount -le 0) { throw "autostart: ${id} running but discovered 0 tools" }
            Write-Host "autostart: $id running, $($entry.toolCount) tool(s) — offline, via the scheduled task"
          }

      - name: Stop the task-spawned gateway
        if: always()
        shell: pwsh
        run: |
          # No PID file for this one (only `start --detach`, via the CLI,
          # writes one) — find it by command line instead. `--autostart` is
          # the marker that distinguishes it from the interactively-started
          # instance (started via the CLI's `start`, which never passes that
          # flag) running concurrently on different ports.
          $procs = Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object { $_.CommandLine -like '*server.js*--autostart*' }
          foreach ($p in $procs) {
            Write-Host "killing pid $($p.ProcessId): $($p.CommandLine)"
            taskkill /PID $p.ProcessId /T /F 2>$null
          }
          if (-not $procs) { Write-Host "(nothing to kill — the task-spawned gateway was not found running)" }

          # taskkill's own exit code is unreliable here: killing a whole
          # process TREE where a child may have already exited on its own
          # left $LASTEXITCODE non-zero and failed this step for real on
          # windows-latest, even though every PID printed SUCCESS. GitHub's
          # pwsh steps fail on a stale non-zero $LASTEXITCODE from the LAST
          # native command run, so clear it and verify by RE-QUERYING
          # instead of trusting taskkill's own exit status.
          Start-Sleep -Seconds 1
          $remaining = Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object { $_.CommandLine -like '*server.js*--autostart*' }
          $global:LASTEXITCODE = 0
          if ($remaining) {
            throw "task-spawned gateway process(es) still running after taskkill: $($remaining.ProcessId -join ', ')"
          }
          Write-Host "confirmed: no server.js --autostart process remains"

      - name: service uninstall — scheduled task removed
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Programs\Suveren\suveren-gateway.cmd" service uninstall
          if ($LASTEXITCODE -ne 0) { throw "service uninstall exited $LASTEXITCODE" }
          $t = Get-ScheduledTask -TaskName 'Suveren' -ErrorAction SilentlyContinue
          if ($t) { throw "scheduled task 'Suveren' still present after service uninstall" }
          Write-Host "scheduled task removed"

      - name: service install again — so the final uninstall is tested WITHOUT a prior CLI service uninstall
        shell: pwsh
        run: |
          # The real IT path is msiexec/Intune uninstall directly — nobody
          # runs our CLI's `service uninstall` first. Re-register here so the
          # "Uninstall the msi" step below genuinely tests the MSI's OWN
          # uninstall-cleanup custom action (RemoveScheduledTaskOnUninstall in
          # Product.wxs), not the CLI path already proved above.
          & "$env:LOCALAPPDATA\Programs\Suveren\suveren-gateway.cmd" service install
          if ($LASTEXITCODE -ne 0) { throw "service install exited $LASTEXITCODE" }
          $t = Get-ScheduledTask -TaskName 'Suveren' -ErrorAction Stop
          Write-Host "scheduled task re-registered: $($t.TaskName), state $($t.State)"

      - name: Uninstall the msi — WITHOUT a prior service uninstall or stop; the MSI's own cleanup must do both
        if: always()
        shell: pwsh
        run: |
          # Deliberately did NOT call `suveren-gateway stop` before this: the
          # interactive instance from "Start via the installed launcher" is
          # still running. This is the real IT scenario — Intune/msiexec
          # uninstalls directly, with no chance to run our CLI first — and
          # it's what StopGatewayOnUninstall / RemoveScheduledTaskOnUninstall
          # (Product.wxs) exist to handle: release the gateway's own file
          # locks before Windows Installer removes them, and clean up the
          # scheduled task re-registered in the previous step.
          $msi = (Resolve-Path msi\suveren-gateway.msi).Path
          $log = "$env:RUNNER_TEMP\uninstall.log"
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "::group::uninstall log"
            Get-Content $log
            Write-Host "::endgroup::"
            throw "msiexec /x exited $($p.ExitCode)"
          }

          $root = "$env:LOCALAPPDATA\Programs\Suveren"
          if (Test-Path $root) { throw "install dir still present after uninstall: $root" }
          $t = Get-ScheduledTask -TaskName 'Suveren' -ErrorAction SilentlyContinue
          if ($t) { throw "scheduled task 'Suveren' still present after msi uninstall (no prior CLI service uninstall ran — the MSI's own cleanup custom action must remove it)" }

          # No gateway process of ANY kind should survive — neither the
          # interactive one (left running on purpose, into this uninstall)
          # nor any stray task-spawned one.
          $leftover = Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object { $_.CommandLine -like '*gateway\server.js*' }
          if ($leftover) { throw "gateway process(es) still running after msi uninstall: $($leftover.ProcessId -join ', ')" }

          Write-Host "clean: install dir gone, scheduled task gone, no gateway process left — all without a prior CLI stop or service uninstall"

      - name: Gateway log
        if: always()
        shell: pwsh
        run: |
          $log = "$env:USERPROFILE\.suveren\gateway.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(no log file)" }

      - name: Final cleanup — kill any lingering gateway process (best effort, so the runner doesn't end a failed test still running one)
        if: always()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object { $_.CommandLine -like '*Suveren*gateway\server.js*' } |
            ForEach-Object {
              Write-Host "cleanup: killing pid $($_.ProcessId)"
              taskkill /PID $_.ProcessId /T /F 2>$null
            }
          $global:LASTEXITCODE = 0

  # ─── The scenario that actually hangs on a real machine: upgrading over a
  #     RUNNING gateway (started by the scheduled task, not the CLI's own
  #     `start`), and uninstalling the same way. Separate job, its own two
  #     msis built from the one shared payload (just a different
  #     -d ProductVersion — the payload content doesn't need to differ for
  #     what this proves). ─────────────────────────────────────────────────
  upgrade-test:
    name: upgrade + uninstall (task-started gateway)
    needs: build-payload
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SUVEREN_INTERNAL_SECRET: windows-upgrade-test-internal-secret
      # Points at nothing — the gateway must never need it, before OR after
      # the upgrade.
      npm_config_registry: 'http://127.0.0.1:9'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: windows-payload
          path: bundle/windows/payload

      - name: Install WiX v5 (+ UI extension, for the interactive-install Finish checkbox)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Compute old/new versions
        id: versions
        shell: bash
        run: |
          set -e
          OLD="${{ needs.build-payload.outputs.version }}"
          IFS='.' read -r MA MI PA <<< "$OLD"
          NEW="$MA.$MI.$((PA + 1))"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old: $OLD -> new: $NEW"

      - name: wix build — old and new msi, same payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle\windows\out | Out-Null
          $payload = (Resolve-Path bundle\windows\payload).Path
          $launcher = (Resolve-Path bundle\windows\launcher.cmd).Path
          foreach ($pair in @(
            @{ Version = "${{ steps.versions.outputs.old }}"; Out = 'old.msi' },
            @{ Version = "${{ steps.versions.outputs.new }}"; Out = 'new.msi' }
          )) {
            wix build bundle\windows\wix\Product.wxs `
              -ext WixToolset.UI.wixext/5.0.2 `
              -d "ProductVersion=$($pair.Version)" `
              -d "PayloadDir=$payload" `
              -d "LauncherSource=$launcher" `
              -arch x64 `
              -out "bundle\windows\out\$($pair.Out)"
            if ($LASTEXITCODE -ne 0) { throw "wix build failed for $($pair.Out) ($($pair.Version))" }
          }

      - name: Install OLD — service install, start via the scheduled task
        shell: pwsh
        run: |
          $msi = (Resolve-Path bundle\windows\out\old.msi).Path
          $log = "$env:RUNNER_TEMP\install-old.log"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "::group::install-old log"; Get-Content $log; Write-Host "::endgroup::"
            throw "msiexec /i (old) exited $($p.ExitCode)"
          }

          & "$env:LOCALAPPDATA\Programs\Suveren\suveren-gateway.cmd" service install
          if ($LASTEXITCODE -ne 0) { throw "service install exited $LASTEXITCODE" }

          schtasks /Run /TN Suveren
          if ($LASTEXITCODE -ne 0) { throw "schtasks /Run exited $LASTEXITCODE" }

      - name: Wait for the task-started gateway (OLD) — default ports, no CLI involved
        shell: pwsh
        run: |
          $targets = @('crm', 'records', 'erp')
          $deadline = (Get-Date).AddSeconds(240)
          $body = $null
          while ((Get-Date) -lt $deadline) {
            try {
              $body = Invoke-RestMethod -Uri 'http://localhost:3430/health' -TimeoutSec 5
              $statuses = $body.integrations | Where-Object { $targets -contains $_.id }
              $allUp = ($statuses.Count -eq $targets.Count) -and ($statuses | ForEach-Object { $_.running -and $_.toolCount -gt 0 }) -notcontains $false
              if ($allUp) { break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          Write-Host ($body | ConvertTo-Json -Depth 5)
          foreach ($id in $targets) {
            $entry = $body.integrations | Where-Object { $_.id -eq $id }
            if (-not $entry -or -not $entry.running -or $entry.toolCount -le 0) {
              throw "OLD: $id is not running with tools before the upgrade — nothing to prove an upgrade against"
            }
          }
          Write-Host "OLD gateway confirmed running via the scheduled task, connectors up."

      - name: a) Install NEW over the running OLD — this is the hang this test exists to catch
        id: upgrade
        shell: pwsh
        run: |
          $msi = (Resolve-Path bundle\windows\out\new.msi).Path
          $log = "$env:RUNNER_TEMP\install-new-upgrade.log"
          "log=$log" >> $env:GITHUB_OUTPUT
          $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -PassThru

          $timeoutMs = 5 * 60 * 1000
          $completed = $proc.WaitForExit($timeoutMs)
          if (-not $completed) {
            Write-Host "::error::msiexec /i (upgrade) did not finish within 5 minutes — this is the real hang ('Please wait while Windows configures Suveren Gateway')"
            try { $proc.Kill() } catch {}
            throw "upgrade install timed out"
          }
          if ($proc.ExitCode -ne 0) {
            Write-Host "::group::upgrade install log"; Get-Content $log; Write-Host "::endgroup::"
            throw "msiexec /i (upgrade) exited $($proc.ExitCode)"
          }
          Write-Host "upgrade install completed, exit code $($proc.ExitCode)"

      - name: a) Upload the upgrade install log on failure
        if: failure() && steps.upgrade.outputs.log != ''
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-install-log
          path: ${{ steps.upgrade.outputs.log }}
          if-no-files-found: warn

      - name: a) Assert exactly one product registered, at the NEW version
        shell: pwsh
        run: |
          $apps = @(
            Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ItemProperty $_.PSPath } |
              Where-Object { $_.DisplayName -eq 'Suveren Gateway' }
          )
          if ($apps.Count -ne 1) {
            throw "expected exactly 1 registered 'Suveren Gateway' product after the upgrade, found $($apps.Count)"
          }
          $expected = "${{ steps.versions.outputs.new }}"
          if ($apps[0].DisplayVersion -ne $expected) {
            throw "registered DisplayVersion is '$($apps[0].DisplayVersion)', expected '$expected'"
          }
          Write-Host "exactly one product registered, DisplayVersion $($apps[0].DisplayVersion) (confirms the files on disk are the NEW version's — MSI only replaces files when it recognizes this as the same product being upgraded)"

      - name: a) Assert the scheduled task survived the upgrade and still points at the launcher
        shell: pwsh
        run: |
          $t = Get-ScheduledTask -TaskName 'Suveren' -ErrorAction Stop
          $action = $t.Actions[0]
          Write-Host "action: $($action.Execute) $($action.Arguments)"
          $expectedLauncher = "$env:LOCALAPPDATA\Programs\Suveren\suveren-gateway.cmd"
          if ($action.Execute -ne $expectedLauncher) { throw "task Command is '$($action.Execute)', expected '$expectedLauncher'" }
          if ($action.Arguments -ne 'run') { throw "task Arguments is '$($action.Arguments)', expected 'run'" }
          Write-Host "scheduled task survived the upgrade, still points at the (now-upgraded) launcher."

      - name: a) Assert the gateway is running again after the upgrade — RestartScheduledTaskAfterInstall
        shell: pwsh
        run: |
          $targets = @('crm', 'records', 'erp')
          $deadline = (Get-Date).AddSeconds(240)
          $body = $null
          while ((Get-Date) -lt $deadline) {
            try {
              $body = Invoke-RestMethod -Uri 'http://localhost:3430/health' -TimeoutSec 5
              $statuses = $body.integrations | Where-Object { $targets -contains $_.id }
              $allUp = ($statuses.Count -eq $targets.Count) -and ($statuses | ForEach-Object { $_.running -and $_.toolCount -gt 0 }) -notcontains $false
              if ($allUp) { break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          Write-Host ($body | ConvertTo-Json -Depth 5)
          foreach ($id in $targets) {
            $entry = $body.integrations | Where-Object { $_.id -eq $id }
            if (-not $entry) { throw "NEW: $id not in the integration registry after the upgrade — the gateway did not come back on its own" }
            if (-not $entry.running) { throw "NEW: $id registered but not running after the upgrade ($($entry.error))" }
            if ($entry.toolCount -le 0) { throw "NEW: $id running but discovered 0 tools after the upgrade" }
          }
          Write-Host "gateway came back on its own after the upgrade (RestartScheduledTaskAfterInstall), connectors up offline — nobody had to log out and back in."

      - name: b) Uninstall while the task-started gateway is running — the case the old uninstall test never covered
        id: uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path bundle\windows\out\new.msi).Path
          $log = "$env:RUNNER_TEMP\uninstall.log"
          "log=$log" >> $env:GITHUB_OUTPUT
          $proc = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$log`"" -PassThru

          $timeoutMs = 5 * 60 * 1000
          $completed = $proc.WaitForExit($timeoutMs)
          if (-not $completed) {
            Write-Host "::error::msiexec /x did not finish within 5 minutes"
            try { $proc.Kill() } catch {}
            throw "uninstall timed out"
          }
          if ($proc.ExitCode -ne 0) {
            Write-Host "::group::uninstall log"; Get-Content $log; Write-Host "::endgroup::"
            throw "msiexec /x exited $($proc.ExitCode)"
          }

          $root = "$env:LOCALAPPDATA\Programs\Suveren"
          if (Test-Path $root) { throw "install dir still present after uninstall: $root" }
          $t = Get-ScheduledTask -TaskName 'Suveren' -ErrorAction SilentlyContinue
          if ($t) { throw "scheduled task 'Suveren' still present after uninstall" }
          $leftover = Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object { $_.ExecutablePath -and $_.ExecutablePath.ToLower().StartsWith("$($root.ToLower())\") }
          if ($leftover) { throw "node.exe still running under the (now-deleted) install dir: $($leftover.ProcessId -join ', ')" }

          Write-Host "clean: uninstalled a RUNNING task-started gateway, dir gone, task gone, no leftover node.exe under the install dir."

      - name: b) Upload the uninstall log on failure
        if: failure() && steps.uninstall.outputs.log != ''
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-test-uninstall-log
          path: ${{ steps.uninstall.outputs.log }}
          if-no-files-found: warn

      - name: Final cleanup — kill any lingering gateway process (best effort)
        if: always()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process -Filter "Name='node.exe'" |
            Where-Object { $_.CommandLine -like '*Suveren*gateway\server.js*' } |
            ForEach-Object {
              Write-Host "cleanup: killing pid $($_.ProcessId)"
              taskkill /PID $_.ProcessId /T /F 2>$null
            }
          $global:LASTEXITCODE = 0

  # ─── Attach unsigned msi + signing kit to the GitHub Release for the tag.
  #     Tag pushes and manual dispatch only — never on a PR. ─────────────────
  release:
    name: publish release assets
    # Tag pushes ONLY. Deliberately excludes workflow_dispatch — that trigger
    # exists so this workflow's build/install-test jobs can be iterated on
    # from a branch without a tag (see bundle/windows/* development), and
    # must never have a side effect of creating a release or a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-payload, build-msi, install-test, prove-signing-kit, upgrade-test]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: windows-payload
          path: release/payload

      - uses: actions/download-artifact@v4
        with:
          name: windows-msi-unsigned
          path: release/msi

      - name: Assemble release assets
        id: assets
        shell: pwsh
        run: |
          $version = "${{ needs.build-payload.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release\out | Out-Null

          $msiOut = "release\out\suveren-gateway-$version-windows-unsigned.msi"
          Copy-Item release\msi\suveren-gateway.msi $msiOut

          Copy-Item -Recurse bundle\windows\wix release\kit\wix
          Copy-Item bundle\windows\launcher.cmd release\kit\launcher.cmd
          Copy-Item bundle\windows\build-signed.ps1 release\kit\build-signed.ps1
          Copy-Item -Recurse release\payload release\kit\payload

          $kitZip = "release\out\suveren-gateway-$version-windows-signing-kit.zip"
          Compress-Archive -Path release\kit\* -DestinationPath $kitZip

          $sums = Get-ChildItem release\out -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          # LF, not Set-Content's CRLF — see build-signed.ps1 (shasum -c on
          # macOS/Linux otherwise reports every file as missing).
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path release\out) 'SHA256SUMS'), (($sums -join "`n") + "`n"), [System.Text.Encoding]::ASCII)
          Get-Content release\out\SHA256SUMS
          bash -c "cd release/out && sha256sum -c SHA256SUMS"
          if ($LASTEXITCODE -ne 0) { throw "sha256sum -c failed on the release SHA256SUMS" }

          "msi=$msiOut" >> $env:GITHUB_OUTPUT
          "kit=$kitZip" >> $env:GITHUB_OUTPUT

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ steps.assets.outputs.msi }}
            ${{ steps.assets.outputs.kit }}

      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/out/*.msi
            release/out/*.zip
            release/out/SHA256SUMS
