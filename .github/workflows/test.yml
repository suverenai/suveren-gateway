name: Unit tests

# The workspace's 739 unit cases had no CI of their own: bundle-smoke.yml
# proves the distribution starts and probes clean, publish workflows ship it,
# but nothing ran `pnpm -r test` on a push. That suite is where the
# Gatekeeper's enforcement lives — read governance, content binding, receipt
# retry, commitment-mode downgrade, fail-closed behaviour — so it should not
# depend on someone remembering to run it locally.
#
# Note the root package.json has no `test` script by design; `-r` is required
# to reach the per-app suites.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          path: suveren-gateway

      # Profiles live in a sibling checkout by design — there is no in-repo
      # copy. Two suites (deploy-profile, content-binding-fields) assert
      # against the real published profiles, so without this they fail on an
      # undefined profile rather than on anything they mean to test.
      - uses: actions/checkout@v6
        with:
          repository: humanagencyprotocol/hap-profiles
          path: hap-profiles

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          # The repo is no longer at the workspace root (it sits beside
          # hap-profiles), so the lockfile has to be named explicitly.
          cache-dependency-path: suveren-gateway/pnpm-lock.yaml

      - name: Install
        working-directory: suveren-gateway
        run: pnpm install --frozen-lockfile

      # Build first: the workspace's hap-core wrapper re-exports the published
      # package, and several suites import from built output. A test run over a
      # stale graph passes for the wrong reason.
      - name: Build
        working-directory: suveren-gateway
        run: pnpm build

      # The report layout suite (apps/mcp-server/test/report/
      # render-report.browser.test.ts) proves in a real browser that an AI
      # block cannot cover a verified box. REPORT_BROWSER_TEST=required makes
      # a missing browser a failure here instead of a local skip.
      - name: Install Chromium for the report layout test
        working-directory: suveren-gateway
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        working-directory: suveren-gateway
        env:
          REPORT_BROWSER_TEST: required
        run: pnpm -r test

  # The native Touch ID helper (device-keys step 5a, packages/unlock-helper) is Swift for macOS on Apple silicon,
  # so it cannot be tested on the Linux runner above. This job builds it and runs:
  #   - the Swift tests (the Secure Enclave suite skips itself: a CI virtual machine has no Secure Enclave),
  #   - the control plane's tests with the real helper process (debug build, software backend: real protocol, no touch),
  #   - the RELEASE helper (build-app.sh, ad-hoc signed Suveren.app, no --allow-any-caller) started by the control
  #     plane's own code with the real hash check and the real caller check (platform-release-helper.test.ts),
  #   - the check that bundle/build.mjs --with-helper refuses a debug helper.
  # No touch is made anywhere; the prompts are checked by hand (packages/unlock-helper/DESIGN.md section 9).
  macos-helper:
    runs-on: macos-15  # macos-14 is retired on GitHub (refused 2026-11-20)
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          path: suveren-gateway

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: suveren-gateway/pnpm-lock.yaml

      - name: Install
        working-directory: suveren-gateway
        run: pnpm install --frozen-lockfile

      - name: Build (workspace)
        working-directory: suveren-gateway
        run: pnpm -r build

      - name: Swift build (debug helper) and Swift tests
        working-directory: suveren-gateway/packages/unlock-helper/macos
        run: |
          swift build
          ./test.sh

      - name: Release helper (Suveren.app, ad-hoc signed)
        working-directory: suveren-gateway/packages/unlock-helper/macos
        run: ./build-app.sh

      - name: Helper client tests (real debug helper)
        working-directory: suveren-gateway/packages/unlock-helper
        run: pnpm test

      - name: Control plane tests (real debug helper, release helper, bundle check)
        working-directory: suveren-gateway/apps/control-plane
        env:
          SUVEREN_HELPER_BUILD: ${{ github.workspace }}/suveren-gateway/packages/unlock-helper/macos/dist
        run: pnpm test
