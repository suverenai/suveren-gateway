name: Unit tests

# The workspace's 739 unit cases had no CI of their own: bundle-smoke.yml
# proves the distribution starts and probes clean, publish workflows ship it,
# but nothing ran `pnpm -r test` on a push. That suite is where the
# Gatekeeper's enforcement lives — read governance, content binding, receipt
# retry, commitment-mode downgrade, fail-closed behaviour — so it should not
# depend on someone remembering to run it locally.
#
# Note the root package.json has no `test` script by design; `-r` is required
# to reach the per-app suites.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          path: suveren-gateway

      # Profiles live in a sibling checkout by design — there is no in-repo
      # copy. Two suites (deploy-profile, content-binding-fields) assert
      # against the real published profiles, so without this they fail on an
      # undefined profile rather than on anything they mean to test.
      - uses: actions/checkout@v6
        with:
          repository: humanagencyprotocol/hap-profiles
          path: hap-profiles

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          # The repo is no longer at the workspace root (it sits beside
          # hap-profiles), so the lockfile has to be named explicitly.
          cache-dependency-path: suveren-gateway/pnpm-lock.yaml

      - name: Install
        working-directory: suveren-gateway
        run: pnpm install --frozen-lockfile

      # Build first: the workspace's hap-core wrapper re-exports the published
      # package, and several suites import from built output. A test run over a
      # stale graph passes for the wrong reason.
      - name: Build
        working-directory: suveren-gateway
        run: pnpm build

      # The report layout suite (apps/mcp-server/test/report/
      # render-report.browser.test.ts) proves in a real browser that an AI
      # block cannot cover a verified box. REPORT_BROWSER_TEST=required makes
      # a missing browser a failure here instead of a local skip.
      - name: Install Chromium for the report layout test
        working-directory: suveren-gateway
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        working-directory: suveren-gateway
        env:
          REPORT_BROWSER_TEST: required
        run: pnpm -r test

  # The native Touch ID helper (device-keys step 5a, packages/unlock-helper) is Swift for macOS on Apple silicon,
  # so it cannot be tested on the Linux runner above. This job builds it and runs:
  #   - the Swift tests (the Secure Enclave suite skips itself: a CI virtual machine has no Secure Enclave),
  #   - the control plane's tests with the real helper process (debug build, software backend: real protocol, no touch),
  #   - the RELEASE helper (build-app.sh, ad-hoc signed Suveren.app, no --allow-any-caller) started by the control
  #     plane's own code with the real hash check and the real caller check (platform-release-helper.test.ts),
  #   - the check that bundle/build.mjs --with-helper refuses a debug helper.
  # No touch is made anywhere; the prompts are checked by hand (packages/unlock-helper/DESIGN.md section 9).
  macos-helper:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          path: suveren-gateway

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: suveren-gateway/pnpm-lock.yaml

      - name: Install
        working-directory: suveren-gateway
        run: pnpm install --frozen-lockfile

      - name: Build (workspace)
        working-directory: suveren-gateway
        run: pnpm -r build

      - name: Swift build (debug helper) and Swift tests
        working-directory: suveren-gateway/packages/unlock-helper/macos
        run: |
          swift build
          ./test.sh

      - name: Release helper (Suveren.app, ad-hoc signed)
        working-directory: suveren-gateway/packages/unlock-helper/macos
        run: ./build-app.sh

      - name: Helper client tests (real debug helper)
        working-directory: suveren-gateway/packages/unlock-helper
        run: pnpm test

      - name: Control plane tests (real debug helper, release helper, bundle check)
        working-directory: suveren-gateway/apps/control-plane
        env:
          SUVEREN_HELPER_BUILD: ${{ github.workspace }}/suveren-gateway/packages/unlock-helper/macos/dist
        run: pnpm test

  # The Windows unlock helper (packages/unlock-helper/windows, Go; DESIGN.md section 8) on a real Windows runner:
  #   - the Go tests, on Windows (the caller rule with Windows paths, the reason texts, the wrap, DER signatures),
  #   - the helper client's tests against the real DEBUG helper process (software backend: the same answers as the
  #     macOS helper and the Node reference), and its caller check against real parent processes: the gateway-like
  #     launcher is served, a parent with node options, NODE_OPTIONS or a script elsewhere is refused (exit 77),
  #   - the control plane's route tests with the real debug helper in place of the Swift one,
  #   - the RELEASE helper started by the control plane's own code with the real hash check and caller check
  #     (platform-release-helper-windows.test.ts), and the bundle's refusal of a debug helper.
  # Windows Hello is NOT tested: a runner has no Hello and no usable TPM, and the release helper keeps the TPM path
  # switched off until it is measured on real hardware. It must say "no secure hardware" here, and that is checked.
  windows-helper:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          path: suveren-gateway

      - uses: actions/setup-go@v5
        with:
          go-version-file: suveren-gateway/packages/unlock-helper/windows/go.mod
          cache-dependency-path: suveren-gateway/packages/unlock-helper/windows/go.sum

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: suveren-gateway/pnpm-lock.yaml

      - name: Install
        working-directory: suveren-gateway
        run: pnpm install --frozen-lockfile

      - name: Build (workspace)
        working-directory: suveren-gateway
        run: pnpm -r build

      - name: Go vet and tests (debug tag, software backend)
        working-directory: suveren-gateway/packages/unlock-helper/windows
        run: |
          go vet ./...
          go vet -tags debug ./...
          go test -tags debug ./...

      - name: Build the helper (release and debug, x64 and arm64)
        working-directory: suveren-gateway/packages/unlock-helper/windows
        shell: bash
        run: |
          node build.mjs dist
          CONFIG=debug node build.mjs dist-debug

      - name: Helper client tests (real debug helper)
        working-directory: suveren-gateway/packages/unlock-helper
        shell: bash
        env:
          SUVEREN_TEST_HELPER: ${{ github.workspace }}\suveren-gateway\packages\unlock-helper\windows\dist-debug\windows-x64\suveren-unlock-helper.exe
        run: |
          # hap-core's verifier of check signatures (what the Authority Server and other gateways run)
          HC="$(ls -d ../../node_modules/.pnpm/@humanagencyp+hap-core@*/node_modules/@humanagencyp/hap-core/dist/device-keys/index.mjs | tail -1)"
          export HAP_CORE_DEVICE_KEYS="$(cygpath -w "$(cd "$(dirname "$HC")" && pwd)/index.mjs")"
          pnpm test

      - name: Control plane tests (real debug helper, release helper, bundle check)
        working-directory: suveren-gateway/apps/control-plane
        env:
          SUVEREN_TEST_HELPER: ${{ github.workspace }}\suveren-gateway\packages\unlock-helper\windows\dist-debug\windows-x64\suveren-unlock-helper.exe
          SUVEREN_WINDOWS_HELPER_RELEASE: ${{ github.workspace }}\suveren-gateway\packages\unlock-helper\windows\dist
          SUVEREN_WINDOWS_HELPER_DEBUG: ${{ github.workspace }}\suveren-gateway\packages\unlock-helper\windows\dist-debug
        run: pnpm exec vitest run src/routes/__tests__/platform.test.ts src/routes/__tests__/device-recovery.test.ts src/routes/__tests__/platform-release-helper-windows.test.ts src/__tests__/bundle-helper-check.test.ts
