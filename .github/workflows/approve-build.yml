name: Approve app - build

# Builds the phone app (apps/approve) from a release tag, proves the build can
# be repeated, hashes every served file, and signs the result (GitHub artifact
# attestations). It publishes NOTHING to the web: putting the files at
# approve.suveren.ai is approve-publish.yml, and that runs only through the
# gated release (a mandate, a ticket, a person's approval). See
# docs/approve-release.md.
#
# Trigger: a tag `approve-vX.Y.Z`, or a manual dry run (workflow_dispatch),
# which builds, rebuilds and attests but creates no release.
#
# Until apps/approve exists, the stand-in is the fixture page of
# packages/approval-card, so the whole pipeline can be exercised.

on:
  push:
    tags: ['approve-v*']
  workflow_dispatch:

# No job gets a permission it does not list itself.
permissions: {}

concurrency:
  group: approve-build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned so two builds of the same commit give the same bytes.
  NODE_VERSION: '22.14.0'
  PNPM_VERSION: '10.32.1'
  # Where the finished files end up, relative to the repository root.
  DIST: approve-dist

jobs:
  # ── 1. Build, and write the manifest ──────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Name and source commit of this build
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            if ! echo "$tag" | grep -Eq '^approve-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::tag '$tag' is not of the form approve-vX.Y.Z"
              exit 1
            fi
            # A release is built from main, never from a side branch.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
              echo "::error::$tag points at a commit that is not on main"
              exit 1
            fi
          else
            tag="approve-dry-run"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building $tag from $SHA"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      # No package cache: a release build starts from nothing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the app
        run: |
          set -euo pipefail
          pnpm --filter @hap/core build
          if [ -d apps/approve ]; then
            pnpm --filter @suveren/approve build
            out=apps/approve/dist
          else
            # Stand-in until apps/approve exists: the fixture page of the shared card.
            pnpm --filter @suveren/approval-card fixture:build
            out=packages/approval-card/fixture/dist
            mv "$out/fixture/index.html" "$out/index.html"
            rmdir "$out/fixture"
          fi
          test -f "$out/index.html"
          rm -rf "$DIST"
          cp -R "$out" "$DIST"

      - name: Hash every served file into the manifest
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: node scripts/approve-release.mjs manifest "$DIST" --tag "$TAG" --commit "$COMMIT" --out manifest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approve-build
          path: |
            approve-dist
            manifest.json
          if-no-files-found: error
          include-hidden-files: true   # a dotfile in the app must not drop out silently
          retention-days: 30

  # ── 2. Build again on another machine; the bytes must be identical ─────────
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Build the app again
        run: |
          set -euo pipefail
          pnpm --filter @hap/core build
          if [ -d apps/approve ]; then
            pnpm --filter @suveren/approve build
            out=apps/approve/dist
          else
            pnpm --filter @suveren/approval-card fixture:build
            out=packages/approval-card/fixture/dist
            mv "$out/fixture/index.html" "$out/index.html"
            rmdir "$out/fixture"
          fi
          rm -rf "$DIST"
          cp -R "$out" "$DIST"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approve-build
          path: first-build

      - name: The second build must match the first, byte for byte
        run: node scripts/approve-release.mjs compare --manifest first-build/manifest.json --dir "$DIST"

  # ── 3. Sign: one attestation per built file, and one for the manifest ──────
  attest:
    runs-on: ubuntu-latest
    needs: [build, rebuild]
    permissions:
      contents: read
      id-token: write       # Sigstore signing identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approve-build

      - name: The files are still the ones that were hashed
        run: node scripts/approve-release.mjs compare --manifest manifest.json --dir approve-dist

      - name: Attest each built file and the manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            approve-dist/**
            manifest.json

  # ── 4. Attach to the release (tag builds only) ─────────────────────────────
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [build, attest]
    permissions:
      contents: write       # create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approve-build

      # Release assets are a flat list, and the served files sit in folders, so
      # they travel as one archive. The attestations are per file: a person
      # unpacks it and verifies each file (docs/approve-release.md).
      - name: Pack the files and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -C approve-dist . | gzip -n > approve-dist.tar.gz
          gh release create "$TAG" manifest.json approve-dist.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$COMMIT" \
            --title "Approve app $TAG" \
            --notes "Phone app build from commit $COMMIT. Not live: it goes live only through the gated release (approve-publish.yml). Verify by hand: docs/approve-release.md."
